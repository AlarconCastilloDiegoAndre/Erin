    <style>
        /* Estilos específicos para la Galería Mosaico interactiva (NUEVA PALETA) */
        .filtros-galeria {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 40px;
        }

        .btn-filtro {
            background-color: transparent;
            border: 1px solid #2b1700;
            /* Borde en marrón profundo */
            color: #2b1700;
            /* Texto en marrón profundo */
            padding: 10px 25px;
            font-family: 'Calibri Light', Calibri, sans-serif;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.3s ease;
        }

        .btn-filtro:hover,
        .btn-filtro.activo {
            background-color: #900603;
            /* Rojo de acento */
            border-color: #900603;
            color: #ffffff;
            /* Letras blancas para contrastar */
        }

        /* Sistema moderno de Mosaico (CSS Grid) */
        .mosaico-galeria {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            grid-auto-rows: 200px;
            gap: 15px;
        }

        .item-galeria {
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(43, 23, 0, 0.05);
            /* Sombra basada en el marrón */
            transition: transform 0.3s ease;
            /* Animación de entrada al filtrar */
            animation: fadeIn 0.5s ease-in-out;
        }

        .item-galeria img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease, filter 0.5s ease;
            filter: grayscale(20%);
        }

        .item-galeria:hover {
            transform: translateY(-5px);
            z-index: 2;
            box-shadow: 0 8px 15px rgba(144, 6, 3, 0.2);
            /* Brillo rojo sutil al hacer hover */
        }

        .item-galeria:hover img {
            transform: scale(1.05);
            filter: grayscale(0%);
        }

        /* Clase para ocultar imágenes no seleccionadas */
        .oculto {
            display: none;
        }

        /* Tamaños variados para hacer efecto Pinterest en el Grid */
        .item-galeria:nth-child(3n) {
            grid-row: span 2;
        }

        .item-galeria:nth-child(7n) {
            grid-column: span 2;
            grid-row: span 2;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Adaptación del mosaico para celulares */
        @media (max-width: 480px) {
            .item-galeria:nth-child(7n) {
                grid-column: span 1;
            }

            .mosaico-galeria {
                grid-auto-rows: 150px;
            }
        }
    </style>
</head>

    <script>
        function filtrarGaleria(categoria) {
            const items = document.querySelectorAll('.item-galeria');
            const botones = document.querySelectorAll('.btn-filtro');

            // Actualizar estado de los botones
            botones.forEach(btn => btn.classList.remove('activo'));
            event.target.classList.add('activo');

            // Mostrar/Ocultar imágenes con animación
            items.forEach(item => {
                item.style.animation = 'none'; // Reinicia la animación
                item.offsetHeight; // Reflow forzado
                item.style.animation = null;

                if (categoria === 'todas' || item.classList.contains(categoria)) {
                    item.classList.remove('oculto');
                } else {
                    item.classList.add('oculto');
                }
            });
        }
    </script>
