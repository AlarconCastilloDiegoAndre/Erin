    <script>
        function filtrarGaleria(categoria) {
            const items = document.querySelectorAll('.item-galeria');
            const botones = document.querySelectorAll('.btn-filtro');

            // Cambiar estado activo en los botones
            botones.forEach(btn => btn.classList.remove('activo'));
            event.target.classList.add('activo');

            // Filtrar elementos con animación
            items.forEach(item => {
                // Reinicia la animación para volver a ejecutarla al cambiar de filtro
                item.style.animation = 'none';
                item.offsetHeight;
                item.style.animation = null;

                if (categoria === 'todas' || item.classList.contains(categoria)) {
                    item.classList.remove('oculto');
                } else {
                    item.classList.add('oculto');
                }
            });
        }
    </script>
